# Set the terminal tab/window title to the current session (or group, when grouped).
set -g set-titles on
set -g set-titles-string "#{?session_grouped,#{session_group},#S}"

# Pass modified keys such as Shift+Enter through to programs.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Per-host overrides
if-shell '[ -f ~/.config/tmux/tmux.local.conf ]' 'source-file ~/.config/tmux/tmux.local.conf'
