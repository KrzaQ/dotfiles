# limes config.d drop-in, installed by these dotfiles (module `limes`).
#
# Brings this machine's user environment into a limes sandbox. The tracked rc files are
# symlinks into the repo, and docker flattens symlinks on mount -- `link = "parent"`
# tells limes to recreate the symlink inside and mount its target's parent dir (so the
# zsh `plugins/` submodules come along and self-locating config resolves like the host).
# The per-machine `.local` files are `optional` -- present on some machines, not others.
#
# Keys are home-relative, so this file is machine-independent (hence a plain symlink,
# not generated). Hand-written mounts belong in ~/.config/limes/config.toml, not here.

[mounts]
# Every tool's config, read-only: without it $HOME is a bare tmpfs and mc, htop, btop,
# lazygit and friends start unconfigured -- or, like mc, fail outright trying to create
# their own directory. Read-only means those that rewrite state on exit will complain;
# limes is meant to grow an overlay mode for exactly this, and this entry becomes
# `mode = "overlay"` when it does.
"~/.config"         = "ro"

# ...minus the dirs that hold live credentials, which the mount above would otherwise hand
# to anything running in the sandbox. `hide` no-ops on machines where these are absent, so
# the list can be the union across all of them.
#
# This is a blocklist and it will rot -- the next tool to stash a token under ~/.config
# lands inside the sandbox and nothing says so. Re-scan occasionally rather than trusting
# it; it buys back the obvious cases, not a guarantee.
"~/.config/gh"        = "hide"   # GitHub OAuth token (hosts.yml)
"~/.config/secrets"   = "hide"   # env files for MCP servers
"~/.config/filezilla" = "hide"   # server passwords, barely obfuscated
"~/.config/immich"    = "hide"   # auth.yml: API key + instance URL

# Deliberately NOT hidden: ~/.config/cursor. Its auth.json is cursor-agent's credential,
# the same category as ~/.claude -- limes detects the agent and mounts it rw so it runs
# authenticated inside. Hiding it here would win (config beats agent detection) and break
# the agent instead of protecting anything.

# Not under ~/.config, so the mount above doesn't reach it. `link = "parent"` for the same
# reason the zsh files below use it: a plain mount of a symlink is canonicalized, so the
# repo file lands at its own path and ~/.vimrc -- the only path vim looks at -- stays empty.
"~/.vimrc"          = { mode = "ro", link = "parent" }

"~/.zshrc"          = { mode = "ro", link = "parent" }
"~/.zprofile"       = { mode = "ro", link = "parent" }
"~/.zshenv"         = { mode = "ro", link = "parent" }
"~/.zprofile.local" = { mode = "ro", optional = true }
"~/.zshrc.local"    = { mode = "ro", optional = true }

[forward]
# Forward the unrestricted gpg-agent socket, not the restricted one.
#
# The restricted socket confirms every use of a key through pinentry, and gpg-agent will
# not trust a client-supplied tty for that prompt -- so with `pinentry-program
# pinentry-tty` (what these machines use) there is nowhere to draw it and signing inside a
# sandbox always fails with "Operation cancelled", cached passphrase or not. Verified from
# the host too, over the same socket, on a real tty: same failure. The restricted socket
# here does not mean "confirm each use", it means "never sign from a sandbox".
#
# The trade, stated plainly: while the passphrase is cached (6h here, 48h max), anything
# running in a sandbox can sign as me without being asked. The key itself never enters --
# it stays an oracle, one that stopped asking. Escapable per run with
# `--no-gpg-unrestricted`.
gpg_unrestricted = true

[toolchains]
# Mirror the host's rbenv and uv into the sandbox. Without these, $HOME being a tmpfs means
# `ruby` inside is the system copy (not the rbenv-selected version) and `uv` is missing --
# so a sandbox can't run the toolchain the host actually uses.
#
# ro: run the installed versions, don't mutate them from inside (installs land on tmpfs and
# vanish, which is fine for a sandbox). optional: these live on some machines and not others,
# and a non-optional toolchain that's absent is a hard error -- optional makes it a skip.
uv    = { mode = "ro", optional = true }
rbenv = { mode = "ro", optional = true }
